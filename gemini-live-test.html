<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sadia · Gemini Live টেস্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--t:#f3eaff;--dim:rgba(243,234,255,.6)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#06040d;color:var(--t);font-family:'Hind Siliguri',system-ui,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(900px 620px at 50% 24%,rgba(125,72,225,.30),transparent 62%),radial-gradient(720px 520px at 50% 108%,rgba(255,168,128,.15),transparent 62%),linear-gradient(180deg,#0b0716,#05030a)}
#app{width:100%;max-width:440px;padding:16px;display:flex;flex-direction:column;gap:10px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font:700 18px 'Hind Siliguri',sans-serif;text-align:center}
#stage{width:min(72vw,280px);height:min(72vw,280px);margin:0 auto}
#status{text-align:center;color:var(--dim);font-size:14px;min-height:1.4em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:var(--t);font:15px 'Hind Siliguri',sans-serif}
select option{color:#000}
button{padding:11px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:var(--t);font:600 15px 'Hind Siliguri',sans-serif;cursor:pointer}
#go{width:100%;padding:16px;font-size:17px;background:linear-gradient(135deg,#ffbe96,#8c5aff);color:#14061f;border:0}
#go.on{background:linear-gradient(135deg,#ff7a7a,#ff9a5a)}
.box{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);font-size:15px;line-height:1.5;min-height:2.6em}
.box small{display:block;color:var(--dim);font-size:11px}
label{font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center}
pre{white-space:pre-wrap;font-size:11px;color:var(--dim);max-height:140px;overflow:auto}
</style>
</head>
<body>
<div id="app">
  <h1>Sadia · Gemini Live টেস্ট</h1>
  <div id="stage"></div>
  <div id="status">প্রস্তুত</div>
  <div class="row"><input id="key" type="password" placeholder="Gemini API key বসান" autocomplete="off"><button id="save">সেভ</button></div>
  <div class="row">
    <select id="voice"><option value="Kore">মেয়ে · Kore</option><option value="Aoede">মেয়ে · Aoede</option><option value="Leda">মেয়ে · Leda</option><option value="Zephyr">মেয়ে · Zephyr</option><option value="Puck">ছেলে · Puck</option><option value="Charon">ছেলে · Charon</option><option value="Orus">ছেলে · Orus</option><option value="Fenrir">ছেলে · Fenrir</option></select>
    <select id="lang"><option value="bn">বাংলা</option><option value="en">English</option><option value="hi">हिन्दी</option><option value="ur">اردو</option><option value="ar">العربية</option><option value="ms">Melayu</option></select>
  </div>
  <label><input type="checkbox" id="gs" checked style="flex:none"> Google Search চালু (আজকের তথ্যের জন্য)</label>
  <button id="go">🎙 কথা শুরু করুন</button>
  <div class="box"><small>আপনি</small><span id="you"></span></div>
  <div class="box"><small>সাদিয়া</small><span id="she"></span></div>
  <pre id="log"></pre>
</div>
<script>
/* Sadia AI – dotted 3D globe. API: AV.init(el), AV.set(mode), AV.mood(name), AV.say(), AV.hook */
window.AV = (() => {
  const N = 5200, NR = 600, TOT = N + NR;
  const X = new Float32Array(TOT), Y = new Float32Array(TOT), Z = new Float32Array(TOT), S = new Float32Array(TOT);
  for (let i = 0; i < N; i++) { const k = (i + 0.5) / N, ph = Math.acos(1 - 2 * k), th = Math.PI * (1 + Math.sqrt(5)) * i; X[i] = Math.sin(ph) * Math.cos(th); Y[i] = Math.cos(ph); Z[i] = Math.sin(ph) * Math.sin(th); S[i] = Math.random() * 6.28; }
  for (let j = 0; j < NR; j++) { const i = N + j, a = (j / NR) * 6.2832 * 3, w = 1.28 + (Math.random() - 0.5) * 0.14; X[i] = Math.cos(a) * w; Z[i] = Math.sin(a) * w; Y[i] = (Math.random() - 0.5) * 0.05; S[i] = Math.random() * 6.28; }
  const sx = new Float32Array(TOT), sy = new Float32Array(TOT), ss = new Float32Array(TOT), bk = new Uint8Array(TOT);
  let frames = 0, lastErr = '';
  let cv, cx, W = 0, D = 1, mode = 'idle', t = 0, amp = 0, rot = 0, run = false, spin = 0.07, shrink = 1;
  let col = [255, 190, 150], col2 = [140, 90, 255], tc = [255, 190, 150], tc2 = [140, 90, 255];
  const MOODS = { calm: [[255, 190, 150], [140, 90, 255]], happy: [[255, 215, 120], [255, 120, 170]], sad: [[130, 170, 255], [80, 60, 180]], curious: [[80, 255, 200], [120, 160, 255]], angry: [[255, 100, 90], [255, 160, 60]], shy: [[255, 170, 210], [190, 110, 255]] };
  const lerp = (a, b, k) => a + (b - a) * k;
  const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
  const rgba = (c, a) => 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + a + ')';
  function size() {
    const r = cv.parentElement.getBoundingClientRect(); D = Math.min(window.devicePixelRatio || 1, 2);
    W = Math.max(120, Math.min(r.width || 300, r.height || 300)); cv.width = cv.height = Math.round(W * D); cv.style.width = cv.style.height = W + 'px'; cx.setTransform(D, 0, 0, D, 0, 0);
  }
  function draw() {
    t += 0.01;
    const h = typeof api.hook === 'function' ? api.hook() : 0;
    const goal = mode === 'talk' ? Math.max(0.1, h) : mode === 'listen' ? 0.22 + 0.08 * Math.sin(t * 3) : mode === 'think' ? 0.12 : 0.05 + 0.02 * Math.sin(t * 1.4);
    amp = lerp(amp, goal, 0.18); spin = lerp(spin, mode === 'think' ? 0.5 : mode === 'talk' ? 0.16 : 0.07, 0.04); shrink = lerp(shrink, mode === 'think' ? 0.86 : 1, 0.05);
    for (let i = 0; i < 3; i++) { col[i] = lerp(col[i], tc[i], 0.05); col2[i] = lerp(col2[i], tc2[i], 0.05); }
    rot += 0.016 * spin;
    const c = W / 2, R = W * 0.345 * shrink, cy = Math.cos(rot), sy_ = Math.sin(rot), tilt = 0.35 + 0.08 * Math.sin(t * 0.5), ct = Math.cos(tilt), st = Math.sin(tilt);
    cx.globalCompositeOperation = 'source-over'; cx.clearRect(0, 0, W, W);
    cx.globalCompositeOperation = 'lighter';
    const g = cx.createRadialGradient(c, c, R * 0.1, c, c, W * 0.5); g.addColorStop(0, rgba(col, 0.22 + amp * 0.3)); g.addColorStop(0.55, rgba(col2, 0.07)); g.addColorStop(1, rgba(col2, 0)); cx.fillStyle = g; cx.fillRect(0, 0, W, W);
    for (let i = 0; i < TOT; i++) {
      const x = X[i], y = Y[i], z = Z[i], s = S[i], ring = i >= N;
      let n = Math.sin(x * 3 + t * 1.3 + s * 0.2) * Math.sin(y * 3 - t * 1.1) + Math.sin(z * 4 + t * 0.9);
      let d = 0.012 * n + amp * 0.12 * Math.sin(x * 7 + y * 5 + z * 6 + t * (mode === 'talk' ? 9 : 4) + s);
      if (mode === 'listen') d += 0.04 * Math.sin(y * 7 - t * 5);
      if (mode === 'think') d += 0.03 * Math.sin(Math.atan2(z, x) * 5 + t * 6);
      const r = R * (ring ? 1 + d * 0.5 : 1 + d);
      const xr = (x * cy + z * sy_) * r, zr = (-x * sy_ + z * cy) * r, yr0 = y * r;
      const yr = yr0 * ct - zr * st, zz = yr0 * st + zr * ct;
      const p = 1 / (1 - zz / (W * 1.6)), dep = (zz / (R * 1.4) + 1) / 2;
      sx[i] = c + xr * p; sy[i] = c + yr * p;
      ss[i] = (0.42 + 0.62 * Math.max(0, Math.min(1, dep))) * p * (ring ? 0.8 : 1) * (W / 300);
      const ci = Math.max(0, Math.min(5, Math.floor(((ring ? 0.5 : (y + 1) / 2) + 0.16 * Math.sin(t * 0.9 + y * 3 + x * 2)) * 6)));
      const hi = !ring && (Math.abs(y - Math.sin(t * 0.9) * 0.85) < 0.06 || Math.sin(t * 1.3 + s * 5) > 0.975); if (hi) ss[i] *= 1.6; bk[i] = ci * 3 + (hi ? 2 : dep < 0.3 ? 0 : dep < 0.62 ? 1 : 2);
    }
    for (let b = 0; b < 18; b++) {
      const ci = (b / 3) | 0, di = b % 3; let cc = mix(col, col2, ci / 5); if (di === 2) cc = mix(cc, [255, 255, 255], 0.28);
      cx.fillStyle = rgba(cc, [0.16, 0.5, 1][di]); cx.beginPath();
      for (let i = 0; i < TOT; i++) if (bk[i] === b) { cx.moveTo(sx[i] + ss[i], sy[i]); cx.arc(sx[i], sy[i], ss[i], 0, 6.2832); }
      cx.fill();
    }
    cx.fillStyle = rgba(mix(col, col2, 0.4), 0.06); cx.beginPath();
    for (let i = 0; i < N; i += 3) if (bk[i] % 3 === 2) { cx.moveTo(sx[i] + ss[i] * 4, sy[i]); cx.arc(sx[i], sy[i], ss[i] * 4, 0, 6.2832); }
    cx.fill();
  }
  function frame() { try { draw(); frames++; } catch (e) { lastErr = String(e.message || e); } requestAnimationFrame(frame); }
  const api = {
    hook: null,
    init(el) {
      el.innerHTML = ''; cv = document.createElement('canvas'); cv.style.display = 'block'; cv.style.margin = 'auto'; el.append(cv); cx = cv.getContext('2d');
      size(); window.addEventListener('resize', size); if (!run) { run = true; requestAnimationFrame(frame); }
    },
    set(m) { mode = m || 'idle'; },
    mood(m) { const p = MOODS[m] || MOODS.calm; tc = p[0]; tc2 = p[1]; },
    say() {},
    debug() { try { const d = cx.getImageData(0, 0, cv.width, cv.height).data; let n = 0; for (let i = 3; i < d.length; i += 148) if (d[i] > 0) n++; return 'ক্যানভাস ' + cv.width + '×' + cv.height + ', ফ্রেম ' + frames + ', পিক্সেল ' + n + (lastErr ? ', ত্রুটি: ' + lastErr : ''); } catch (e) { return 'debug ত্রুটি: ' + e.message; } }
  };
  return api;
})();

</script>
<script>
const $ = s => document.querySelector(s);
const MODEL = 'models/gemini-3.1-flash-live-preview';
const LN = { bn: 'Bangla (Bangladeshi, everyday spoken style)', en: 'English', hi: 'Hindi', ur: 'Urdu', ar: 'Arabic', ms: 'Malay' };
let ws = null, ac = null, mic = null, node = null, an = null, playT = 0, srcs = [], level = 0, ready = false, fresh = true, lvT = 0;
const log = m => { $('#log').textContent = (new Date().toLocaleTimeString() + '  ' + m + '\n' + $('#log').textContent).slice(0, 3000); };
$('#key').value = localStorage.getItem('gk') || '';
$('#save').onclick = () => { localStorage.setItem('gk', $('#key').value.trim()); log('key সেভ হয়েছে (শুধু এই ফোনে)'); };
AV.init($('#stage')); AV.hook = () => level;
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a.buffer; };
const sys = () => 'You are Sadia, a warm, playful young Bangladeshi woman and a close friend of the user. Speak ' + LN[$('#lang').value] + '. Keep spoken answers short: one to three sentences. Show natural human emotion in your voice: joy, sympathy, worry, shyness, laughter. Use Google Search for anything current (news, weather, prices, scores) and never guess facts. If you do not know, say so.';
async function start() {
  const key = $('#key').value.trim(); if (!key) return log('আগে API key দিন');
  try {
    $('#status').textContent = 'সংযোগ হচ্ছে…';
    ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    an = ac.createAnalyser(); an.fftSize = 256; an.connect(ac.destination);
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    await ac.audioWorklet.addModule(URL.createObjectURL(new Blob(["class P extends AudioWorkletProcessor{process(i){const c=i[0][0];if(c)this.port.postMessage(c.slice());return true}}registerProcessor('p',P)"], { type: 'application/javascript' })));
    node = new AudioWorkletNode(ac, 'p'); ac.createMediaStreamSource(mic).connect(node);
    ready = false; fresh = true;
    ws = new WebSocket('wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(key));
    ws.onopen = () => ws.send(JSON.stringify({ setup: { model: MODEL, generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $('#voice').value } } } }, systemInstruction: { parts: [{ text: sys() }] }, tools: $('#gs').checked ? [{ googleSearch: {} }] : [], inputAudioTranscription: {}, outputAudioTranscription: {} } }));
    ws.onmessage = async e => { try { handle(JSON.parse(typeof e.data === 'string' ? e.data : await e.data.text())); } catch (er) { log('বার্তা ত্রুটি: ' + er.message); } };
    ws.onclose = ev => { log('বন্ধ হয়েছে: ' + ev.code + ' ' + (ev.reason || '')); stop(); };
    ws.onerror = () => log('ওয়েবসকেট ত্রুটি');
    const ratio = ac.sampleRate / 16000;
    node.port.onmessage = e => {
      if (!ready || !ws || ws.readyState !== 1) return;
      const f = e.data, n = Math.floor(f.length / ratio), o = new Int16Array(n);
      for (let i = 0; i < n; i++) { let s = 0, c = 0; for (let k = Math.floor(i * ratio); k < Math.floor((i + 1) * ratio) && k < f.length; k++) { s += f[k]; c++; } const v = Math.max(-1, Math.min(1, c ? s / c : 0)); o[i] = v < 0 ? v * 32768 : v * 32767; }
      ws.send(JSON.stringify({ realtimeInput: { audio: { data: b64(o.buffer), mimeType: 'audio/pcm;rate=16000' } } }));
    };
    lvT = setInterval(() => { const d = new Uint8Array(an.fftSize); an.getByteTimeDomainData(d); let s = 0; for (const v of d) s += (v - 128) ** 2; level = Math.min(1, Math.sqrt(s / d.length) / 30); }, 50);
    $('#go').textContent = '⏹ বন্ধ করুন'; $('#go').classList.add('on');
  } catch (e) { log('শুরু হয়নি: ' + e.message); stop(); }
}
function stopPlay() { srcs.forEach(s => { try { s.stop(); } catch {} }); srcs = []; playT = 0; }
function play(b) {
  const i16 = new Int16Array(unb64(b)), f = new Float32Array(i16.length); for (let i = 0; i < f.length; i++) f[i] = i16[i] / 32768;
  const buf = ac.createBuffer(1, f.length, 24000); buf.copyToChannel(f, 0);
  const s = ac.createBufferSource(); s.buffer = buf; s.connect(an);
  playT = Math.max(playT, ac.currentTime + 0.05); s.start(playT); playT += buf.duration; srcs.push(s);
  s.onended = () => { srcs = srcs.filter(x => x !== s); if (!srcs.length) { AV.set('listen'); $('#status').textContent = 'শুনছি… কথা বলুন'; } };
  AV.set('talk'); $('#status').textContent = 'সাদিয়া বলছে…';
}
function handle(m) {
  if (m.setupComplete) { ready = true; $('#status').textContent = 'শুনছি… কথা বলুন'; AV.set('listen'); log('সংযুক্ত'); return; }
  if (m.error) { log('সার্ভার ত্রুটি: ' + JSON.stringify(m.error).slice(0, 200)); return; }
  const sc = m.serverContent; if (!sc) return;
  if (sc.interrupted) { stopPlay(); AV.set('listen'); }
  if (sc.inputTranscription && sc.inputTranscription.text) { if (fresh) { $('#you').textContent = ''; $('#she').textContent = ''; fresh = false; } $('#you').textContent += sc.inputTranscription.text; AV.set('think'); }
  if (sc.outputTranscription && sc.outputTranscription.text) $('#she').textContent += sc.outputTranscription.text;
  if (sc.modelTurn) for (const p of sc.modelTurn.parts || []) if (p.inlineData && p.inlineData.data) play(p.inlineData.data);
  if (sc.turnComplete) fresh = true;
}
function stop() {
  ready = false; clearInterval(lvT); level = 0;
  try { ws && ws.close(); } catch {} ws = null; stopPlay();
  try { mic && mic.getTracks().forEach(t => t.stop()); } catch {} mic = null;
  try { ac && ac.close(); } catch {} ac = null;
  AV.set('idle'); $('#status').textContent = 'প্রস্তুত'; $('#go').textContent = '🎙 কথা শুরু করুন'; $('#go').classList.remove('on');
}
$('#go').onclick = () => (ws ? stop() : start());
</script>
</body>
</html>
